[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-agent"
version = "0.2.0"
description = "A repository-aware coding agent CLI with native tool calling"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
skillpilot = "skillPilot.cli:main"
skill-agent = "skillPilot.cli:main"

[tool.setuptools.packages.find]
include = ["skillPilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
ignore = ["BLE001", "N999", "S110"]
